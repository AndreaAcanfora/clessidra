[package]
name = "clessidra"
description = "Undo for your whole disk: every version of every file in the folders you choose, rewindable to any moment."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["undo", "backup", "versioning", "history", "cli"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "clessidra"
path = "src/main.rs"

[dependencies]
clessidra-core.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
